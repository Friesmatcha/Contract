<body class="bg-workspace-mist min-h-screen flex items-center justify-center font-body text-body text-on-surface antialiased p-lg">
<div class="w-full max-w-md">
<!-- Brand Logo -->
<div class="text-center mb-xl">
<h1 class="font-page-title text-page-title text-primary font-bold tracking-tight">合同智审</h1>
</div>
<!-- Auth Card -->
<div class="bg-paper-white rounded-lg border border-structural-border overflow-hidden">
<div class="p-xl">
<!-- Heading & Subtext -->
<div class="text-center mb-xl">
<h2 class="font-page-title text-page-title text-on-surface mb-xs">接受邀请</h2>
<p class="font-body text-body text-muted-text">验证邀请后即可继续。</p>
</div>
<!-- Alert Reservation (Hidden by default, shown here for demonstration) -->
<div class="hidden mb-lg p-md bg-error-container text-on-error-container rounded border border-[#ffb4ab] flex items-start gap-sm">
<span class="material-symbols-outlined text-[#93000a] shrink-0 mt-0.5">error</span>
<div class="font-body text-body">
<strong>邀请已过期</strong>
<p class="mt-base text-[#93000a]">请联系您的管理员重新发送邀请链接。</p>
</div>
</div>
<!-- Form -->
<form class="space-y-md">
<!-- Display Name -->
<div>
<label class="block font-form-label text-form-label text-on-surface mb-base" for="displayName">展示名</label>
<input class="w-full h-10 px-sm bg-paper-white border border-structural-border rounded focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body text-body text-on-surface placeholder-placeholder-gray transition-colors" id="displayName" name="displayName" placeholder="输入您的展示名称" type="text"/>
</div>
<!-- Password -->
<div>
<label class="block font-form-label text-form-label text-on-surface mb-base" for="password">密码</label>
<input class="w-full h-10 px-sm bg-paper-white border border-structural-border rounded focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body text-body text-on-surface placeholder-placeholder-gray transition-colors" id="password" name="password" placeholder="设置密码" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-form-label text-form-label text-on-surface mb-base" for="confirmPassword">确认密码</label>
<input class="w-full h-10 px-sm bg-paper-white border border-structural-border rounded focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body text-body text-on-surface placeholder-placeholder-gray transition-colors" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" type="password"/>
</div>
<!-- Helper Text -->
<div class="mt-xs">
<p class="font-metadata text-metadata text-muted-text flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">info</span>
                            这些字段仅在创建新账号时需要。
                        </p>
</div>
<!-- Actions -->
<div class="pt-lg space-y-md">
<button class="w-full h-10 flex justify-center items-center bg-primary text-on-primary font-section-title text-section-title rounded hover:bg-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                            接受邀请
                        </button>
<div class="text-center">
<a class="font-body text-body text-primary hover:text-primary-container transition-colors" href="#">
                                返回登录
                            </a>
</div>
</div>
</form>
</div>
</div>

<div class="mt-xl text-center">
<p class="font-metadata text-metadata text-muted-text">
