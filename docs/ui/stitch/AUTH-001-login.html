<body class="bg-workspace-mist text-on-surface font-body min-h-screen flex flex-col items-center justify-center antialiased">
<!-- Main Content Area -->
<main class="w-full flex-grow flex flex-col items-center justify-center px-margin-desktop py-lg">
<!-- Identity & Descriptor -->
<div class="text-center mb-xl">
<h1 class="font-page-title text-page-title text-on-surface mb-xs tracking-tight">合同智审</h1>
<p class="font-metadata text-metadata text-muted-text">企业合同智能审核与风险预警系统</p>
</div>
<!-- Login Form Container -->
<div class="w-full max-w-[400px] bg-paper-white border border-structural-border rounded shadow-sm p-lg">
<h2 class="font-section-title text-section-title text-on-surface mb-sm">登录</h2>
<!-- Reserved Error Region (Hidden by default, height reserved) -->
<div class="h-[24px] mb-md font-metadata text-metadata text-error invisible flex items-center" id="error-message">
<span class="material-symbols-outlined text-[16px] mr-base" style="font-variation-settings: 'FILL' 1;">error</span>
<span>用户名或密码错误。</span>
</div>
<form class="space-y-md" onsubmit="event.preventDefault(); showError();">
<!-- Email Input -->
<div class="flex flex-col">
<label class="font-form-label text-form-label text-on-surface mb-base" for="email">邮箱</label>
<input class="w-full h-[40px] px-sm bg-paper-white border border-structural-border rounded text-body font-body text-on-surface placeholder-placeholder-gray transition-colors" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col">
<div class="flex justify-between items-center mb-base">
<label class="font-form-label text-form-label text-on-surface" for="password">密码</label>
<a class="font-metadata text-metadata text-primary hover:text-surface-tint transition-colors" href="#">忘记密码？</a>
</div>
<div class="relative">
<input class="w-full h-[40px] pl-sm pr-10 bg-paper-white border border-structural-border rounded text-body font-body text-on-surface transition-colors" id="password" name="password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 px-sm flex items-center text-placeholder-gray hover:text-muted-text transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[40px] mt-md bg-primary-container text-on-primary font-section-title text-section-title rounded hover:bg-surface-tint active:bg-primary transition-colors flex items-center justify-center" type="submit">
                    登录
                </button>
</form>
</div>

<script>
        // Simple script to toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }

        // Demo function to show error state
        function showError() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.remove('invisible');
            
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.classList.add('border-error');
                input.classList.remove('border-structural-border');
            });
            
            // Remove error after 3 seconds for demo purposes
            setTimeout(() => {
                errorDiv.classList.add('invisible');
                inputs.forEach(input => {
                    input.classList.remove('border-error');
                    input.classList.add('border-structural-border');
                });
            }, 3000);
        }
    </script>
