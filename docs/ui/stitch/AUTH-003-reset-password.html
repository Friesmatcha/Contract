<body class="bg-workspace-mist min-h-screen flex flex-col items-center justify-center font-body text-body text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Main Flex Container to push footer down -->
<div class="flex-grow flex flex-col items-center justify-center w-full px-4 sm:px-6 lg:px-8">
<!-- Product Identity Anchor -->
<div class="mb-8 text-center">
<h1 class="font-page-title text-page-title text-primary tracking-tight">合同智审</h1>
</div>
<!-- Authentication Card -->
<div class="w-full max-w-[400px] bg-paper-white border border-structural-border rounded-lg p-8">
<!-- Card Header -->
<div class="mb-8 text-center">
<h2 class="font-page-title text-page-title text-on-surface mb-2">重置密码</h2>
<p class="font-metadata text-metadata text-muted-text">为了您的系统安全，请设置一个新的访问密码。</p>
</div>
<!-- Reset Password Form -->
<form action="#" class="space-y-5" method="POST">
<!-- New Password Field -->
<div>
<label class="block font-form-label text-form-label text-on-surface mb-1.5" for="new-password">新密码</label>
<div class="relative">
<input class="appearance-none block w-full px-3 py-2 border border-structural-border rounded-lg bg-paper-white text-on-surface font-technical-data text-technical-data placeholder-placeholder-gray focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors h-10" id="new-password" name="new-password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-muted-text hover:text-on-surface focus:outline-none transition-colors" onclick="togglePassword('new-password', 'icon-new-password')" type="button">
<span class="material-symbols-outlined" id="icon-new-password" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<!-- Validation message placeholder (hidden by default) -->
<p class="mt-1.5 font-metadata text-metadata text-error hidden" id="new-password-error">密码长度必须至少为8个字符。</p>
</div>
<!-- Confirm New Password Field -->
<div>
<label class="block font-form-label text-form-label text-on-surface mb-1.5" for="confirm-password">确认新密码</label>
<div class="relative">
<input class="appearance-none block w-full px-3 py-2 border border-structural-border rounded-lg bg-paper-white text-on-surface font-technical-data text-technical-data placeholder-placeholder-gray focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors h-10" id="confirm-password" name="confirm-password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-muted-text hover:text-on-surface focus:outline-none transition-colors" onclick="togglePassword('confirm-password', 'icon-confirm-password')" type="button">
<span class="material-symbols-outlined" id="icon-confirm-password" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<!-- Validation message placeholder (hidden by default) -->
<p class="mt-1.5 font-metadata text-metadata text-error hidden" id="confirm-password-error">两次输入的密码不一致。</p>
</div>
<!-- Password Policy Info Box -->
<div class="bg-quiet-panel border border-structural-border rounded-lg p-3 flex items-start gap-2 mt-2">
<span class="material-symbols-outlined text-informational-cyan shrink-0" style="font-size: 16px; margin-top: 1px;">info</span>
<p class="font-metadata text-metadata text-muted-text leading-tight">请按照页面返回的密码要求设置新密码</p>
</div>
<!-- Primary Action -->
<div class="pt-3">
<button class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-lg font-form-label text-form-label text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all h-10" type="submit">
                        重置密码
                    </button>
</div>
</form>
<!-- Secondary Action -->
<div class="mt-6 flex justify-center">
<a class="font-form-label text-form-label text-primary hover:text-primary-container transition-colors flex items-center gap-1 group" href="#">
<span class="material-symbols-outlined group-hover:-translate-x-0.5 transition-transform" style="font-size: 16px;">arrow_back</span>
                    返回登录
                </a>
</div>
</div>
</div>
<!-- Minimal Footer -->
<footer class="w-full py-6 mt-auto">
<p class="text-center font-metadata text-metadata text-muted-text">
            © 2024 合同智审. All rights reserved.
        </p>
</footer>
<!-- Interactive Script for Password Toggle -->
<script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility_off';
            }
        }
    </script>
</body></html>
