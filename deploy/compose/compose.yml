name: contract-review

services:
  reverse-proxy:
    build:
      context: ../..
      dockerfile: deploy/compose/reverse-proxy.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8081}:80"
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/backend.Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contract}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-contract}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: '["http://localhost:${HTTP_PORT:-8081}"]'
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - file-volume:/var/lib/contract-review/files
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/backend.Dockerfile
    command: celery -A backend.app.worker.celery_app:celery_app worker --loglevel=INFO
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - file-volume:/var/lib/contract-review/files
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: deploy/compose/backend.Dockerfile
    command: celery -A backend.app.worker.celery_app:celery_app beat --loglevel=INFO
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contract}
      POSTGRES_USER: ${POSTGRES_USER:-contract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  clamav-data:
  file-volume:
