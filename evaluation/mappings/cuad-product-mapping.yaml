mapping_version: cuad-product-mapping-v1
dataset_id: cuad-v1
disclaimer: CUAD projection is scoped to supported English clause evidence and is not a product acceptance metric.
exact:
  - cuad_category: Parties
    product_target: extracted_field.parties
    rationale: CUAD party spans match the product parties evidence target.
partial:
  - cuad_category: Effective Date
    product_target: extracted_field.signing_date
    rationale: An effective date is not necessarily the execution or signing date.
  - cuad_category: Expiration Date
    product_target: extracted_field.performance_period
    rationale: An expiration date is only one possible representation of a performance period.
  - cuad_category: Renewal Term
    product_target: extracted_field.auto_renewal
    rationale: Renewal term evidence does not establish the full renewal state or exit terms.
  - cuad_category: Notice Period To Terminate Renewal
    product_target: extracted_field.auto_renewal
    rationale: Notice period is one component of automatic renewal.
  - cuad_category: Governing Law
    product_target: extracted_field.dispute_resolution
    rationale: Governing law is not the complete dispute resolution field.
  - cuad_category: Payment Terms
    product_target: extracted_field.payment_terms
    rationale: CUAD does not guarantee all payment nodes, proportions, or late-liability semantics.
  - cuad_category: Termination For Convenience
    product_target: risk.termination_or_change_right
    rationale: A clause occurrence is not itself a product risk finding.
  - cuad_category: Confidentiality
    product_target: risk.confidentiality
    rationale: Clause evidence does not establish whether the confidentiality obligation is risky.
  - cuad_category: Intellectual Property
    product_target: risk.intellectual_property
    rationale: Clause evidence does not establish ownership, transfer, or risk direction.
  - cuad_category: Force Majeure
    product_target: risk.force_majeure
    rationale: Clause evidence does not establish imbalance or missing protection.
unsupported:
  - cuad_category: Affiliate License-Licensee
    rationale: No standalone product metric for affiliate licensee scope.
